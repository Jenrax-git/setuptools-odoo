ci:
  # don't upgrade some hooks for py2 compat
  skip: [black, pyupgrade]
exclude: ^tests/data/
default_language_version:
  python: python3
repos:
- repo: https://github.com/psf/black
  rev: 24.2.0
  hooks:
  - id: black
    additional_dependencies: ["click<8.1.0"]
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: debug-statements
  - id: fix-encoding-pragma
  - id: check-case-conflict
  - id: check-docstring-first
  - id: check-executables-have-shebangs
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-xml
  - id: check-yaml
  - id: mixed-line-ending
    args: ["--fix=lf"]
- repo: https://github.com/pycqa/flake8
  rev: 7.0.0
  hooks:
  - id: flake8
    additional_dependencies: ["flake8-bugbear==21.4.3"]
- repo: https://github.com/asottile/pyupgrade
  rev: v3.15.1
  hooks:
  - id: pyupgrade
- repo: https://github.com/PyCQA/isort
  rev: 5.13.2
  hooks:
  - id: isort
    name: isort except __init__.py
    exclude: /__init__\.py$

# Local hooks to run setuptools-odoo helpers with the local source (supports Odoo 19.0)
- repo: local
  hooks:
  - id: setuptools-odoo-make-default
    name: Generate default setup.py for an addons directory
    language: python
    entry: setuptools-odoo-make-default
    args: ["--addons-dir=.", "--clean"]
    pass_filenames: false
    additional_dependencies:
      - file:///Users/admin/trabajo/odoo19/setuptools-odoo
      - setuptools<81
  - id: setuptools-odoo-get-requirements
    name: Generate requirements.txt for an addons directory
    language: python
    entry: setuptools-odoo-get-requirements
    args: ["--output=requirements.txt"]
    pass_filenames: false
    files: (__manifest__\.py|__openerp__\.py|__terp__\.py|setup\.py)$
    additional_dependencies:
      - file:///Users/admin/trabajo/odoo19/setuptools-odoo
      - setuptools<81
